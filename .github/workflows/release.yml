name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0-alpha.1)'
        required: true
        default: 'v0.1.0-alpha.1'
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            output: backstage-gen-cli-linux-amd64
          - os: linux
            arch: arm64
            output: backstage-gen-cli-linux-arm64
          - os: darwin
            arch: amd64
            output: backstage-gen-cli-darwin-amd64
          - os: darwin
            arch: arm64
            output: backstage-gen-cli-darwin-arm64
          - os: windows
            arch: amd64
            output: backstage-gen-cli-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          VERSION=${{ steps.version.outputs.version }}
          COMMIT_SHA=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          go build -ldflags "-X main.Version=${VERSION} -X main.CommitSHA=${COMMIT_SHA} -X main.BuildDate=${BUILD_DATE} -w -s" \
            -o bin/${{ matrix.output }} .

      - name: Create checksum
        run: |
          cd bin
          sha256sum ${{ matrix.output }} > ${{ matrix.output }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: |
            bin/${{ matrix.output }}
            bin/${{ matrix.output }}.sha256
          retention-days: 7

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "prerelease=${{ github.event.inputs.prerelease }}" >> $GITHUB_OUTPUT
          else
            VERSION=${GITHUB_REF#refs/tags/}
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            # Mark as prerelease if version contains alpha, beta, or rc
            if [[ "$VERSION" == *"alpha"* ]] || [[ "$VERSION" == *"beta"* ]] || [[ "$VERSION" == *"rc"* ]]; then
              echo "prerelease=true" >> $GITHUB_OUTPUT
            else
              echo "prerelease=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            cp "$dir"* release/ 2>/dev/null || true
          done
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: |
            release/*
          body: |
            ## Backstage Gen CLI ${{ steps.version.outputs.version }}

            ### Installation

            **Linux (amd64):**
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/backstage-gen-cli-linux-amd64 -o backstage-gen-cli
            chmod +x backstage-gen-cli
            sudo mv backstage-gen-cli /usr/local/bin/
            ```

            **macOS (Apple Silicon):**
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/backstage-gen-cli-darwin-arm64 -o backstage-gen-cli
            chmod +x backstage-gen-cli
            sudo mv backstage-gen-cli /usr/local/bin/
            ```

            **macOS (Intel):**
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/backstage-gen-cli-darwin-amd64 -o backstage-gen-cli
            chmod +x backstage-gen-cli
            sudo mv backstage-gen-cli /usr/local/bin/
            ```

            **Windows:**
            Download `backstage-gen-cli-windows-amd64.exe` and add to your PATH.

            ### Verify Download
            ```bash
            # Verify checksum (Linux/macOS)
            sha256sum -c backstage-gen-cli-*.sha256
            ```

            ### Quick Start
            ```bash
            # Inspect your repository
            backstage-gen-cli inspect

            # Generate catalog-info.yaml
            backstage-gen-cli generate

            # Validate the generated file
            backstage-gen-cli lint
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
